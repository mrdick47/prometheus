# Indexer settings (BAC-150 / BAC-188). Read by scripts/index.
# Host-specific limits (index_device, index_threads, checkpoint size) can also be
# set per host in host.conf; host.conf wins over this file.

[index]
# Embedding model directory name under models/embed/. Empty = first one found
# on any connected drive. Changing it flags every index as model-mismatch.
model=
# auto uses CUDA when onnxruntime can see it, otherwise CPU.
index_device=auto
# 0 = let onnxruntime pick (all cores). Lower it on shared hosts.
index_threads=0
# Chunks embedded between checkpoints. Smaller = less work lost on a power cut.
checkpoint_chunks=8192
embed_batch=64
# Sources whose ZIM is scanned page images: need OCR, skipped by build/update.
# Comma separated id prefixes (ids are ZIM names without the _YYYY-MM date).
defer_ocr=survivorlibrary.com_en_all
