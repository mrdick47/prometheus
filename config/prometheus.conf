# Prometheus launcher config
# Paths are relative to the drive root (the directory that contains
# config/, scripts/, library/, apps/, and models/) unless they are
# already absolute. The same file is read by the Unix (.sh) and
# Windows (.ps1) scripts. Do not use quotes, spaces around "=", or
# shell expansions; comments start with #.
#
# Ports and bind address are not specified in BAC-140..157, so these
# are documented defaults. Override here or with environment variables
# of the same name (environment wins).

# Bind on all interfaces so another computer on the LAN can browse
# the library (see docs/QUICKSTART.md). Health checks always use
# 127.0.0.1 on the same machine.
PROMETHEUS_BIND=0.0.0.0

# kiwix-serve (library)
KIWIX_PORT=8080
KIWIX_HEALTH_PATH=/

# llamafile OpenAI-compatible server (optional AI add-on)
LLAMAFILE_PORT=8081
LLAMAFILE_HEALTH_PATH=/v1/models
LLAMAFILE_ARGS=--server --nobrowser

# Optional RAG helper, started only after llamafile is healthy.
# Leave RAG_SERVER empty until Phase 4 ships an indexer/query server.
# Failure of this process must never stop kiwix-serve or llamafile.
RAG_PORT=8082
RAG_HEALTH_PATH=/
RAG_SERVER=

# How long to wait for each HTTP health check, and how often to poll.
HEALTH_TIMEOUT_SEC=45
HEALTH_POLL_SEC=0.5

# Drive-relative directories
LIBRARY_DIR=library
APPS_DIR=apps
MODELS_DIR=models
INDEX_DIR=index
RUN_DIR=run
LOG_DIR=run/logs

# Optional absolute or drive-relative overrides for binaries.
# If empty, scripts search apps/ and the usual per-OS subfolders.
KIWIX_SERVE=
LLAMAFILE=

# Hardware thresholds for the auto launcher (BAC-147).
# High: gaming PC class (discrete GPU plus plenty of RAM), Qwen 14B-32B.
# Mid: 16 GB RAM, or a discrete/modest GPU with at least 8 GB RAM; Qwen ~8B.
# Low: about 8 GB RAM, CPU-only; Qwen or Llama ~3B.
# Below LOW_MIN_RAM_GB, or if no model file will run, stay library-only.
HIGH_MIN_RAM_GB=32
HIGH_REQUIRES_DISCRETE_GPU=1
MID_MIN_RAM_GB=16
MID_GPU_MIN_RAM_GB=8
LOW_MIN_RAM_GB=8
