# Drive clone preset (scripts/index clone, scripts/clone-drive). Read from the TARGET
# drive's config/ first, then from the source drive's. Nothing here is host- or
# drive-letter specific. Every key is optional.

[clone]
# Priority preset for this drive: which sources it should hold, highest priority first.
# Comma separated source ids (ZIM name without .zim and the _YYYY-MM date); * wildcards
# work (alpha*). Empty = every verified source on the source drive, smallest first.
# A source that is not listed is never cloned. When the budget runs out, the first
# sources in this list win and a source that does not fit is excluded (later, smaller
# ones may still fit).
sources=

# standalone: a mirror. An index is copied only when its source ZIM is on the target
#   (or is copied with it by --with-content).
# shared: BAC-187 drive set. The target may also hold indexes for content that lives on
#   the other drive.
# auto: shared when both drives carry a matching prometheus-drive.json (same set_id),
#   otherwise standalone. Safe default.
layout=auto

# Most GiB one clone may add (ZIMs it copies plus index bytes). 0 = target free space
# minus headroom_gb.
budget_gb=0
headroom_gb=10
