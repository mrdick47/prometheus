# Optional per-host limits for Prometheus. Keyed by hostname, not by
# a hardcoded mount path, drive letter, or machine. The updater and the
# start/stop scripts look up the current hostname (or PROMETHEUS_HOSTNAME)
# and use [default] when there is no matching section.
#
# Matching is case-insensitive and uses the short hostname, so [ZEUS]
# matches ZEUS, zeus, and zeus.local.
#
# This file lives on the drive. Safe defaults apply if it is missing.

[default]
# Nightly low-priority update. The installer writes a daily job at hour:minute
# in the host's local timezone when timezone is left empty.
schedule=nightly
hour=3
minute=0
timezone=
nice=19
ionice_class=3
ionice_classdata=7
pause_temp_c=75
allow_market_hours=1
allow_days=all
night_start=02:00
night_end=06:00
library_only=0
skip_ai_when_hot=1
index_device=auto
lock_stale_after_sec=21600

# ZEUS is the first always-on host, not the only one. It also runs
# bacon-trader paper trading, so updates stay on weekend nights, at
# low priority, and pause around 75°C (bacon-trader trips at 85°C).
[ZEUS]
schedule=weekend-nights
allow_days=Fri,Sat,Sun
night_start=22:00
night_end=06:00
timezone=America/Chicago
allow_market_hours=0
market_hours=09:30-16:00
market_hours_tz=America/New_York
nice=19
ionice_class=3
ionice_classdata=7
pause_temp_c=75
temp_sensor=coretemp-package
skip_ai_when_hot=1
index_device=auto
lock_stale_after_sec=21600
